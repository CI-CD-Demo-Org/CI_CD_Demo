name: Manual CI/CD Pipeline with Event Triggers

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      pause_seconds:
        description: "Pause between stages for class demonstration"
        type: choice
        options:
          - "5"
          - "10"
          - "15"
        default: "10"
        required: true

permissions:
  contents: write

jobs:
  checkout-code:
    name: 1. Checkout Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Pause for Demo
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PAUSE: ${{ inputs.pause_seconds }}
        run: |
          for ((i=${PAUSE}; i>0; i--)); do
            echo "Checkout pause: $i second(s) remaining..."
            sleep 1
          done

  setup-node:
    name: 2. Setup Node.js
    needs: checkout-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Pause for Demo
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PAUSE: ${{ inputs.pause_seconds }}
        run: |
          for ((i=${PAUSE}; i>0; i--)); do
            echo "Node.js pause: $i second(s) remaining..."
            sleep 1
          done

  install-dependencies:
    name: 3. Install Dependencies
    needs: setup-node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Pause for Demo
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PAUSE: ${{ inputs.pause_seconds }}
        run: |
          for ((i=${PAUSE}; i>0; i--)); do
            echo "Install pause: $i second(s) remaining..."
            sleep 1
          done

  run-linter:
    name: 4. Run Linter
    needs: install-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint

      - name: Pause for Demo
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PAUSE: ${{ inputs.pause_seconds }}
        run: |
          for ((i=${PAUSE}; i>0; i--)); do
            echo "Linter pause: $i second(s) remaining..."
            sleep 1
          done

  run-tests:
    name: 5. Run Tests
    needs: run-linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Pause for Demo
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PAUSE: ${{ inputs.pause_seconds }}
        run: |
          for ((i=${PAUSE}; i>0; i--)); do
            echo "Test pause: $i second(s) remaining..."
            sleep 1
          done

  antigravity-audit:
    name: 6. Antigravity Code Audit
    needs: run-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANTIGRAVITY_TOKEN: ${{ secrets.ANTIGRAVITY_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Install Antigravity CLI
        if: ${{ env.ANTIGRAVITY_TOKEN != '' && github.event_name != 'pull_request' }}
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Credentials
        if: ${{ env.ANTIGRAVITY_TOKEN != '' && github.event_name != 'pull_request' }}
        run: |
          mkdir -p "$HOME/.gemini/antigravity-cli"
          cat > "$HOME/.gemini/antigravity-cli/antigravity-oauth-token" <<EOF
          {"token":{"access_token":"","token_type":"Bearer","refresh_token":"$ANTIGRAVITY_TOKEN","expiry":"0001-01-01T00:00:00Z"},"auth_method":"consumer"}
          EOF
          chmod 600 "$HOME/.gemini/antigravity-cli/antigravity-oauth-token"

      - name: Run Automated Audit
        if: ${{ env.ANTIGRAVITY_TOKEN != '' && github.event_name != 'pull_request' }}
        run: |
          echo "### Antigravity AI Code Audit Report" > audit_report.md
          echo "Generated on: $(date)" >> audit_report.md
          echo "" >> audit_report.md
          agy --print "Perform a code quality, architecture, and structure review on the repository. Highlight code cleanliness, test coverage, and adherence to AGENTS.md instructions. Format the output as a markdown report with headings and a concise summary."

      - name: Commit and Push Audit Report
        if: ${{ env.ANTIGRAVITY_TOKEN != '' && github.event_name != 'pull_request' }}
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add audit_report.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update Antigravity AI Code Audit Report [skip ci]"
            git push origin HEAD:"refs/heads/$TARGET_REF"
          fi

      - name: Upload Audit Report
        if: ${{ env.ANTIGRAVITY_TOKEN != '' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          path: audit_report.md
          archive: false
