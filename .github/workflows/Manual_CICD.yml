name: CI/CD Pipeline with Manual & Event Triggers

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      pause_seconds:
        description: "Pause between stages for class demonstration"
        type: choice
        options: ["5", "10", "15"]
        default: "10"
        required: true

permissions:
  contents: read

jobs:
  checkout-code:
    name: 1. Checkout Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Pause for Demo
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PAUSE: ${{ inputs.pause_seconds }}
        run: |
          for ((i=PAUSE; i>0; i--)); do
            echo "Checkout pause: $i second(s) remaining..."
            sleep 1
          done

  setup-node:
    name: 2. Setup Node.js
    needs: checkout-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Pause for Demo
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PAUSE: ${{ inputs.pause_seconds }}
        run: |
          for ((i=PAUSE; i>0; i--)); do
            echo "Node.js pause: $i second(s) remaining..."
            sleep 1
          done

  install-dependencies:
    name: 3. Install Dependencies
    needs: setup-node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm install
      - name: Pause for Demo
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PAUSE: ${{ inputs.pause_seconds }}
        run: |
          for ((i=PAUSE; i>0; i--)); do
            echo "Install pause: $i second(s) remaining..."
            sleep 1
          done

  run-linter:
    name: 4. Run Linter
    needs: install-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm install
      - name: Run Linter
        run: npm run lint
      - name: Pause for Demo
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PAUSE: ${{ inputs.pause_seconds }}
        run: |
          for ((i=PAUSE; i>0; i--)); do
            echo "Linter pause: $i second(s) remaining..."
            sleep 1
          done

  run-tests:
    name: 5. Run Tests
    needs: run-linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm install
      - name: Run Tests
        run: npm test
      - name: Pause for Demo
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PAUSE: ${{ inputs.pause_seconds }}
        run: |
          for ((i=PAUSE; i>0; i--)); do
            echo "Test pause: $i second(s) remaining..."
            sleep 1
          done
