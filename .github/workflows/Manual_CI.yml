name: Manual CI Demo

on:
  workflow_dispatch:
    inputs:
      pause_seconds:
        description: "Pause between steps so the class can follow along"
        type: choice
        options:
          - "5"
          - "10"
          - "15"
        default: "10"
        required: true

permissions:
  contents: read

jobs:
  checkout-code:
    name: 1. Checkout Code
    runs-on: ubuntu-latest
    steps:
      - name: Show demo start
        run: echo "Starting the manual CI demo."
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Pause - review checkout
        env:
          DEMO_PAUSE_SECONDS: ${{ inputs.pause_seconds }}
        run: |
          echo "Checkout complete. Pausing so the class can review it..."
          for ((i=${DEMO_PAUSE_SECONDS}; i>0; i--)); do
            echo "Checkout pause: $i second(s) remaining..."
            sleep 1
          done
          echo "Continuing to the next step."

  setup-node:
    name: 2. Setup Node.js
    needs: checkout-code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pause - review Node.js setup
        env:
          DEMO_PAUSE_SECONDS: ${{ inputs.pause_seconds }}
        run: |
          echo "Node.js setup complete. Pausing so the class can review it..."
          for ((i=${DEMO_PAUSE_SECONDS}; i>0; i--)); do
            echo "Node.js pause: $i second(s) remaining..."
            sleep 1
          done
          echo "Continuing to the next step."

  install-deps:
    name: 3. Install Dependencies
    needs: setup-node
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Pause - review dependency installation
        env:
          DEMO_PAUSE_SECONDS: ${{ inputs.pause_seconds }}
        run: |
          echo "Dependencies installed. Pausing so the class can review it..."
          for ((i=${DEMO_PAUSE_SECONDS}; i>0; i--)); do
            echo "Install pause: $i second(s) remaining..."
            sleep 1
          done
          echo "Continuing to the next step."

  lint-code:
    name: 4. Lint Code
    needs: install-deps
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Pause - review lint result
        env:
          DEMO_PAUSE_SECONDS: ${{ inputs.pause_seconds }}
        run: |
          echo "Lint finished. Pausing so the class can review the result..."
          for ((i=${DEMO_PAUSE_SECONDS}; i>0; i--)); do
            echo "Lint pause: $i second(s) remaining..."
            sleep 1
          done
          echo "Continuing to the next step."

  test-code:
    name: 5. Run Tests & Complete
    needs: lint-code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Show demo complete
        run: echo "The CI demo completed successfully."
