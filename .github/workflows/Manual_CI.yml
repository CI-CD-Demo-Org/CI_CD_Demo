name: Manual CI Demo

on:
  workflow_dispatch:
    inputs:
      pause_seconds:
        description: "Pause between steps so the class can follow along"
        type: choice
        options:
          - "5"
          - "10"
          - "15"
        default: "10"
        required: true

permissions:
  contents: read

jobs:
  build-test-lint:
    name: Install, lint, and test
    runs-on: ubuntu-latest

    steps:
      - name: Show demo start
        run: echo "Starting the manual CI demo."

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pause — review checkout
        env:
          DEMO_PAUSE_SECONDS: ${{ inputs.pause_seconds }}
        run: |
          echo "Checkout complete. Pausing for ${DEMO_PAUSE_SECONDS} seconds..."
          sleep "$DEMO_PAUSE_SECONDS"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pause — review Node.js setup
        env:
          DEMO_PAUSE_SECONDS: ${{ inputs.pause_seconds }}
        run: |
          echo "Node.js is ready. Pausing for ${DEMO_PAUSE_SECONDS} seconds..."
          sleep "$DEMO_PAUSE_SECONDS"

      - name: Install dependencies
        run: npm install

      - name: Pause — review dependency installation
        env:
          DEMO_PAUSE_SECONDS: ${{ inputs.pause_seconds }}
        run: |
          echo "Dependencies installed. Pausing for ${DEMO_PAUSE_SECONDS} seconds..."
          sleep "$DEMO_PAUSE_SECONDS"

      - name: Lint
        run: npm run lint

      - name: Pause — review lint result
        env:
          DEMO_PAUSE_SECONDS: ${{ inputs.pause_seconds }}
        run: |
          echo "Lint finished. Pausing for ${DEMO_PAUSE_SECONDS} seconds..."
          sleep "$DEMO_PAUSE_SECONDS"

      - name: Test
        run: npm test

      - name: Show demo complete
        run: echo "The CI demo completed successfully."
